version: '3.8'

services:
  # Backend Server Containers
  backend-1:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: backend-1
    hostname: backend-1
    ports:
      - "8001:8000"
    environment:
      - SERVER_ID=backend-1
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend-2:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: backend-2
    hostname: backend-2
    ports:
      - "8002:8000"
    environment:
      - SERVER_ID=backend-2
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend-3:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: backend-3
    hostname: backend-3
    ports:
      - "8003:8000"
    environment:
      - SERVER_ID=backend-3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Load Balancer Gateway
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gateway
    hostname: gateway
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URLS=http://backend-1:8000,http://backend-2:8000,http://backend-3:8000
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - app-network

  # ML Prediction Service
  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    container_name: ml-service
    hostname: ml-service
    ports:
      - "8001:8000"
    environment:
      - MODEL_PATH=/app/models
    volumes:
      - ml-models:/app/models
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app-network

  # Auto-Scaling Controller
  autoscaler:
    build:
      context: ./services/autoscaler
      dockerfile: Dockerfile
    container_name: autoscaler
    hostname: autoscaler
    environment:
      - GATEWAY_URL=http://gateway:8000
      - BACKEND_BASE_NAME=backend-
      - MIN_SERVERS=1
      - MAX_SERVERS=10
      - SCALE_UP_THRESHOLD=70
      - SCALE_DOWN_THRESHOLD=30
      - COOLDOWN_SECONDS=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - app-network

  # Streamlit Dashboard
  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    hostname: dashboard
    ports:
      - "8501:8501"
    environment:
      - GATEWAY_URL=http://gateway:8000
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - gateway
      - ml-service
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ml-models: